name: Reconstructed Podcast v3 - source authenticity and synthetic media CI
on:
  push:
    branches: [main]
    paths:
      - 'podcast_gpt/**'
      - 'tests/**'
      - '*.bat'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-media-tests:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg + ffprobe on Ubuntu (REQUIRED media tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg + ffprobe on Windows (REQUIRED media tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Require actual FFmpeg and ffprobe (never silently skip media checks)
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg and ffprobe MUST be installed for full media CI'"
      - name: Install application and synthetic test tools (NO model weights)
        run: python -m pip install -e ".[test]"
      - name: Verify source compilation
        run: python -m compileall -q podcast_gpt
      - name: Display optional real FFmpeg tool availability
        run: python -m podcast_gpt doctor
      - name: 45-turn source, rights consent, local dashboard and real SHORT FFmpeg regression
        run: python -m pytest -q tests
      - name: Explicitly limit CI completion claims
        run: python -c "from podcast_gpt import __version__; assert __version__ == '3.1.0'; print('SYNTHETIC tests only; no genuine SadTalker lipsync nor real 10m local Windows rendered')"
  synthetic-full-45-turn-composition:
    name: Extended 45-turn SHORT synthetic video candidate (NOT real model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual FFmpeg + ffprobe (required extended video pipeline)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install app and Python tests (no model weights)
        run: python -m pip install -e ".[test]"
      - name: Verify real FFmpeg is available
        run: ffmpeg -version
      - name: Build and independently verify 45-turn STATIC fake-face candidate
        run: python tests/long_ffmpeg_smoke.py
      - name: Document limited scope
        run: python -c "print('Only 45-turn synthetic SHORT voice/video pipeline, not 10-minute SadTalker nor human lip-sync QA')"

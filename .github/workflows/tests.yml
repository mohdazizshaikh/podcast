name: Reconstructed Podcast v3 - source authenticity and synthetic media CI
on:
  push:
    branches: [main]
    paths:
      - 'podcast_gpt/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '*.bat'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-media-tests:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg + ffprobe on Ubuntu (REQUIRED media tests)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "Already installed; skipping apt downloads."
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
      - name: Install FFmpeg + ffprobe on Windows (REQUIRED media tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey V2 may transiently time out on GitHub-hosted Windows
          # runners; retry the download instead of silently skipping video QA.
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
            $probe = Get-Command ffprobe -ErrorAction SilentlyContinue
            if ($ff -and $probe) { break }
            Write-Host "Installing real FFmpeg/ffprobe (attempt $attempt / 3)"
            choco install ffmpeg --yes --no-progress --execution-timeout=240
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            throw "FFmpeg/ffprobe still unavailable after 3 real Windows installer attempts; media CI must fail closed."
          }
      - name: Require actual FFmpeg and ffprobe (never silently skip media checks)
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg and ffprobe MUST be installed for full media CI'"
      - name: Install application and synthetic test tools (NO model weights)
        run: python -m pip install -e ".[test]"
      - name: Verify source compilation
        run: python -m compileall -q podcast_gpt
      - name: Display optional real FFmpeg tool availability
        run: python -m podcast_gpt doctor
      - name: 45-turn source, rights consent, local dashboard and real SHORT FFmpeg regression
        run: python -m pytest -q tests
      - name: Explicitly limit CI completion claims
        run: python -c "from podcast_gpt import __version__; assert __version__ == '3.7.0'; print('SYNTHETIC tests only; no genuine SadTalker lipsync nor real 10m local Windows rendered')"
  synthetic-full-45-turn-composition:
    name: Extended 45-turn SHORT synthetic video candidate (NOT real model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual FFmpeg + ffprobe (required extended video pipeline)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg and ffprobe already installed; no package mirror required."
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Install app and Python tests (no model weights)
        run: python -m pip install -e ".[test]"
      - name: Verify real FFmpeg is available
        run: ffmpeg -version
      - name: Build and independently verify 45-turn STATIC fake-face candidate
        run: python tests/long_ffmpeg_smoke.py
      - name: Document limited scope
        run: python -c "print('Only 45-turn synthetic SHORT voice/video pipeline, not 10-minute SadTalker nor human lip-sync QA')"

  windows-source-candidate:
    name: Clean Windows source ZIP candidate (not model acceptance)
    needs: [source-media-tests, synthetic-full-45-turn-composition]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify committed source archive
        shell: pwsh
        run: |
          python scripts/build_release.py --output dist/podcast-windows-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_release.py --verify dist/podcast-windows-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure real Windows FFmpeg prerequisites for native launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) { break }
            choco install ffmpeg --yes --no-progress --execution-timeout=240
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            throw "Missing real FFmpeg prerequisites"
          }
      - name: Extract outside repo and smoke test clean app setup
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP "Podcast clean release"
          $app = Join-Path $base "app"
          $studio = Join-Path $base "private synthetic studio"
          Expand-Archive -LiteralPath dist/podcast-windows-source.zip -DestinationPath $app
          $manifest = Get-Content -Raw (Join-Path $app "RELEASE_MANIFEST.json") | ConvertFrom-Json -AsHashtable
          foreach ($name in $manifest.files.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $app $name)).Hash.ToLowerInvariant()
            if ($actual -ne $manifest.files[$name]) { throw "Extracted member checksum differs: $name" }
          }
          Push-Location $app
          try {
            cmd.exe /d /c START_PODCAST_WINDOWS.bat --setup-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmd.exe /d /c START_PODCAST_WINDOWS.bat --setup-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".venv/Scripts/python.exe" -m podcast_gpt.bootstrap check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Explicitly exercise legacy redirected Windows encoding, not only UTF-8.
            $env:PYTHONIOENCODING = "cp1252:strict"
            $initJson = & ".venv/Scripts/python.exe" -m podcast_gpt --workspace "$studio" init
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $initJson | Out-String | ConvertFrom-Json | Out-Null
            $stateJson = & ".venv/Scripts/python.exe" -m podcast_gpt --workspace "$studio" readiness
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $state = $stateJson | Out-String | ConvertFrom-Json
            if ($state.publication_approved -ne $false -or $state.new_model_inference_calls -ne 0) {
              throw "Unexpected model execution or approval claim"
            }
            if (-not (Test-Path (Join-Path $studio "project.json"))) { throw "Missing synthetic project" }
            Remove-Item Env:PYTHONIOENCODING
          } finally {
            Pop-Location
          }
      - name: Upload source-only candidate after successful tests
        uses: actions/upload-artifact@v4
        with:
          name: podcast-windows-source-candidate
          path: |
            dist/podcast-windows-source.zip
            dist/podcast-windows-source.zip.sha256
          if-no-files-found: error
          retention-days: 30

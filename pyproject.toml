[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-gpt-reconstructed"
version = "3.0.0"
description = "Source-bound CPU Hindi three-presenter podcast studio reconstructed from project history"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
tts = ["edge-tts>=7,<9"]

[project.scripts]
podcast-gpt = "podcast_gpt.cli:main"

[tool.setuptools.packages.find]
include = ["podcast_gpt*"]